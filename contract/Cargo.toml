[package]
name = "sage-private-brief"
version = "0.1.0"
edition = "2021"
description = "Sage Private Briefs — seal Sage research briefs into a tenant-private T3 KV map and rewrite them with Gemini inside the TEE, so the Gemini API key and the full brief never touch the browser or CLI"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
wit-bindgen = { version = "0.49", default-features = false, features = ["macros", "realloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
